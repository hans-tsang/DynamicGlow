name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts and JSON
        shell: pwsh
        run: |
          node --check prototype/share.js
          Get-ChildItem prototype -Recurse -Filter *.json | ForEach-Object { Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null }
          Get-Content -Raw tools/version.json | ConvertFrom-Json | Out-Null

      - name: Build portable zip and single exe
        shell: pwsh
        run: ./host/build.ps1 -Release

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = (Get-Content -Raw tools/version.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "tools/version.json ($v) does not match tag $env:GITHUB_REF_NAME" }

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicGlow
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist -File).FullName --title "Dynamic Glow $env:GITHUB_REF_NAME" --generate-notes
